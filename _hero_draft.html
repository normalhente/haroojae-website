  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { overflow-x: clip; }

    :root {
      /* ── 새벽 팔레트 (사진 1 기준) ── */
      --dawn-sky-hi: #6d94b4;     /* 상공 청색 */
      --dawn-sky-mid: #aec5d6;    /* 중천 */
      --dawn-haze: #e9e6e3;       /* 대기 안개층 */
      --dawn-blush: #f3e4da;      /* 지평선 분홍 */
      --ridge-1: #c3d2de;         /* 최원경 능선 */
      --ridge-2: #9fb6c8;
      --ridge-3: #7793a9;
      --ridge-4: #4e6d85;
      --ridge-5: #2e4a60;         /* 최근경 능선 */
      --ink: #14283a;             /* 본문 잉크 (짙은 청먹색) */
      --ink-soft: #3e5a72;
      --rose: #b57a5e;            /* 새벽 노을 포인트 */
    }

    body {
      font-family: source-han-serif-korean, 'Noto Serif KR', Georgia, serif;
      color: var(--ink);
      line-height: 1.8;
      word-break: keep-all;
      overflow-x: clip;
    }

    /* ══════════ HERO ══════════ */
    #hero {
      position: relative;
      min-height: 100vh;
      overflow: clip;
      display: flex;
      align-items: flex-start;
      background: linear-gradient(
        180deg,
        var(--dawn-sky-hi) 0%,
        var(--dawn-sky-mid) 34%,
        var(--dawn-haze) 58%,
        var(--dawn-blush) 72%,
        #e5dcd6 100%
      );
    }

    /* ── 능선 레이어 (아래 고정, 멀수록 높고 밝게) ── */
    .ridge {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      width: 100%;
      pointer-events: none;
    }
    .ridge svg { display: block; width: 100%; height: 100%; }
    .ridge-1 { height: 46vh; }
    .ridge-2 { height: 38vh; }
    .ridge-3 { height: 30vh; }
    .ridge-4 { height: 22vh; }
    .ridge-5 { height: 14vh; }

    /* ── 운무: 능선 사이를 옆으로 흐르는 안개 띠 ── */
    .mist {
      position: absolute;
      left: -50%;
      width: 200%;
      pointer-events: none;
      will-change: transform;
    }
    /* 안개 덩어리들을 radial-gradient 여러 개로 */
    .mist-a {
      bottom: 30vh; height: 16vh; opacity: 0.85;
      background:
        radial-gradient(ellipse 22% 58% at 12% 55%, rgba(245,238,233,0.9), transparent 70%),
        radial-gradient(ellipse 30% 70% at 38% 45%, rgba(240,232,228,0.75), transparent 70%),
        radial-gradient(ellipse 25% 55% at 63% 60%, rgba(246,240,236,0.85), transparent 70%),
        radial-gradient(ellipse 28% 65% at 88% 50%, rgba(240,233,229,0.7), transparent 70%);
      animation: mistDrift 90s linear infinite;
    }
    .mist-b {
      bottom: 21vh; height: 14vh; opacity: 0.75;
      background:
        radial-gradient(ellipse 26% 62% at 20% 50%, rgba(238,230,226,0.85), transparent 70%),
        radial-gradient(ellipse 32% 55% at 50% 58%, rgba(244,236,231,0.7), transparent 70%),
        radial-gradient(ellipse 24% 68% at 78% 45%, rgba(238,231,227,0.8), transparent 70%);
      animation: mistDrift 65s linear infinite reverse;
    }
    .mist-c {
      bottom: 11vh; height: 13vh; opacity: 0.6;
      background:
        radial-gradient(ellipse 30% 60% at 15% 55%, rgba(228,224,222,0.8), transparent 70%),
        radial-gradient(ellipse 26% 66% at 45% 48%, rgba(233,228,225,0.65), transparent 70%),
        radial-gradient(ellipse 34% 58% at 72% 55%, rgba(228,223,221,0.75), transparent 70%),
        radial-gradient(ellipse 22% 60% at 95% 50%, rgba(233,229,226,0.6), transparent 70%);
      animation: mistDrift 48s linear infinite;
    }
    @keyframes mistDrift {
      from { transform: translateX(0); }
      to   { transform: translateX(25%); }
    }

    /* 안개 숨쉬기 (아주 미세한 밝기 변화) */
    .mist::after {
      content: '';
      position: absolute; inset: 0;
      background: inherit;
      opacity: 0;
      animation: mistBreath 14s ease-in-out infinite;
    }
    @keyframes mistBreath {
      0%, 100% { opacity: 0; }
      50% { opacity: 0.35; }
    }

    /* ── 본문 ── */
    #hero .inner {
      position: relative;
      z-index: 3;
      max-width: 1000px;
      margin: 0 auto;
      padding: 16vh 48px 0;
      width: 100%;
    }

    .hero-label {
      font-family: 'garamond-premier-pro', Georgia, serif;
      font-size: 14px;
      letter-spacing: 0.22em;
      color: var(--rose);
      text-transform: uppercase;
      margin-bottom: 18px;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.2s forwards;
    }

    .hero-title {
      font-size: clamp(30px, 7.5vw, 56px);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.38;
      margin-bottom: 26px;
      margin-left: -0.05em;
      max-width: 720px;
      color: var(--ink);
    }
    .hero-title .title-line {
      display: block;
      opacity: 0;
      filter: blur(10px);
      transform: translateY(18px);
      animation: titleReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .hero-title .title-line:nth-child(1) { animation-delay: 0.4s; }
    .hero-title .title-line:nth-child(2) { animation-delay: 0.75s; }
    .hero-title .title-line:nth-child(3) { animation-delay: 1.1s; }
    @keyframes titleReveal {
      to { opacity: 1; filter: blur(0); transform: translateY(0); }
    }

    .hero-desc {
      font-size: 16px;
      color: var(--ink-soft);
      max-width: 500px;
      line-height: 2;
      margin-bottom: 44px;
      opacity: 0;
      animation: fadeUp 0.9s ease 1.5s forwards;
    }

    .hero-cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: source-han-sans-korean, 'Apple SD Gothic Neo', sans-serif;
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--ink);
      border-radius: 2px;
      font-size: 14px;
      padding: 14px 32px;
      text-decoration: none;
      letter-spacing: 0.05em;
      transition: background 0.25s, color 0.25s, border-color 0.25s, transform 0.2s;
      opacity: 0;
      animation: fadeUp 0.9s ease 1.7s forwards;
    }
    .hero-cta::after { content: '→'; transition: transform 0.2s; }
    .hero-cta:hover {
      background: var(--ink);
      color: #f3ece6;
      transform: translateY(-2px);
    }
    .hero-cta:hover::after { transform: translateX(4px); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── 모바일 ── */
    @media (max-width: 768px) {
      #hero .inner { padding: 13vh 24px 0; }
      .hero-desc { font-size: 13px; line-height: 1.9; margin-bottom: 34px; }
      .ridge-1 { height: 34vh; }
      .ridge-2 { height: 28vh; }
      .ridge-3 { height: 22vh; }
      .ridge-4 { height: 16vh; }
      .ridge-5 { height: 10vh; }
      .mist-a { bottom: 22vh; }
      .mist-b { bottom: 15vh; }
      .mist-c { bottom: 8vh; }
    }

    /* 모션 최소화 선호 사용자 배려 */
    @media (prefers-reduced-motion: reduce) {
      .mist-a, .mist-b, .mist-c, .mist::after { animation: none; }
    }
  </style>
</head>

  <!-- ══════════ 조절 패널 (시안 전용 — 배포 시 제거) ══════════ -->
  <style>
    #tunePanel {
      position: fixed; right: 16px; bottom: 16px; z-index: 99;
      font-family: 'Apple SD Gothic Neo', sans-serif;
      width: 260px;
      background: rgba(20, 40, 58, 0.92);
      color: #e8eef3;
      border-radius: 10px;
      padding: 16px 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.35);
      display: none;
    }
    #tunePanel.open { display: block; }
    #tunePanel h3 { font-size: 13px; font-weight: 700; margin-bottom: 12px; letter-spacing: 0.05em; }
    #tunePanel label { display: block; font-size: 11px; margin: 10px 0 3px; color: #b7c6d3; }
    #tunePanel label span { float: right; color: #fff; font-variant-numeric: tabular-nums; }
    #tunePanel input[type=range] { width: 100%; accent-color: #b57a5e; }
    #tuneToggle {
      position: fixed; right: 16px; bottom: 16px; z-index: 100;
      font-family: 'Apple SD Gothic Neo', sans-serif;
      font-size: 13px; padding: 10px 16px;
      background: #14283a; color: #fff;
      border: none; border-radius: 24px; cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    #tunePanel.open ~ #tuneToggle { bottom: auto; top: -100px; }
    #tuneCopy, #tuneClose {
      font-size: 12px; padding: 8px 12px; margin-top: 14px;
      border: none; border-radius: 6px; cursor: pointer;
    }
    #tuneCopy { background: #b57a5e; color: #fff; margin-right: 8px; }
    #tuneClose { background: #3e5a72; color: #fff; }
  </style>

  <div id="tunePanel">
    <h3>🎛 시안 조절판</h3>
    <label>안개 속도 <span id="v-speed">1.0</span>×</label>
    <input type="range" id="s-speed" min="0.2" max="4" value="1" step="0.1">
    <label>안개 진하기 <span id="v-mist">1.0</span>×</label>
    <input type="range" id="s-mist" min="0.2" max="1.6" value="1" step="0.05">
    <button id="tuneCopy">값 복사</button>
    <button id="tuneClose">닫기</button>
  </div>
  <button id="tuneToggle">🎛 조절판 열기</button>

  <script>
    (function() {
      const root = document.documentElement;
      const $ = id => document.getElementById(id);
      const mists = [
        { el: document.querySelector('.mist-a'), dur: 90, op: 0.85 },
        { el: document.querySelector('.mist-b'), dur: 65, op: 0.75 },
        { el: document.querySelector('.mist-c'), dur: 48, op: 0.6 },
      ];

      $('s-speed').oninput = e => {
        const m = parseFloat(e.target.value); $('v-speed').textContent = m.toFixed(1);
        mists.forEach(x => x.el.style.animationDuration = (x.dur / m) + 's');
      };
      $('s-mist').oninput = e => {
        const m = parseFloat(e.target.value); $('v-mist').textContent = m.toFixed(2);
        mists.forEach(x => x.el.style.opacity = Math.min(1, x.op * m));
      };

      $('tuneToggle').onclick = () => { $('tunePanel').classList.add('open'); $('tuneToggle').style.display = 'none'; };
      $('tuneClose').onclick = () => { $('tunePanel').classList.remove('open'); $('tuneToggle').style.display = ''; };
      $('tuneCopy').onclick = () => {
        const txt = `안개속도 ${$('s-speed').value}x / 안개진하기 ${$('s-mist').value}x`;
        navigator.clipboard.writeText(txt).then(() => { $('tuneCopy').textContent = '복사됨!'; setTimeout(() => $('tuneCopy').textContent = '값 복사', 1500); });
      };
    })();
  </script>
